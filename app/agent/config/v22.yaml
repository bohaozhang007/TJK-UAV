mission:
  frame: takeoff_world
  position_unit: cm
  yaw_unit: deg

  # Origin/heading: initial hover. Y right; yaw clockwise; z=0 keeps hover height.
  waypoints:
    # - name: waypoint_1
    #   x_cm: 500.0
    #   y_cm: 0.0
    #   z_cm: 0.0
    #   yaw_deg: 0.0

    # - name: waypoint_2
    #   x_cm: 350.0
    #   y_cm: 0.0
    #   z_cm: 0.0
    #   yaw_deg: 90.0

    # - name: waypoint_3
    #   x_cm: 350.0
    #   y_cm: 850.0
    #   z_cm: 0.0
    #   yaw_deg: 90.0

    - name: waypoint_3
      x_cm: 400.0
      y_cm: 0.0
      z_cm: 0.0
      yaw_deg: 0.0

safety:
  error_action: land # hold or land
  safe_z_cm: 50.0 # World-height floor; orbit Z = max(this, target Z).

patrol:
  detection_stop_interval_m: 1.0
  dedup_distance_cm: 100.0
  dedup_mode: separate # 3d or separate (each axis below the distance).
  waypoint_tolerance_cm: 30.0

photography:
  autofocus: true # Camera framing at the exposure point; false uses orbit photos.

orbit:
  radius_m: 1.0
  dwell_s: 1.0

  all_cand: 8 # Equally spaced candidates.
  top: 2 # Nearest reachable candidates to visit.

localization:
  source: da3 # da3 or grid

  min_depth_pixels: 16
  max_relative_depth_mad: 0.3

  min_target_voxels: 2
  target_depth_gap_m: 0.3 # Depth gap between surface groups.
