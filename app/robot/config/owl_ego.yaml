queries:
  # Maximum map age after query/JSON decoding, independent of RGB freshness.
  map_max_age_s: 1.5

camera_preflight:
  pitch_range_deg: [18, 21]

control:
  takeoff_height_m: 1
  takeoff_speed_m_s: 0.3
  yaw_rate_rad_s: 0.523598776 # 30 deg/s

  position_tolerance_m: 0.15
  yaw_tolerance_rad: 0.0872664626 # 5 deg

  # Stop spans are half the arrival tolerances above.
  stable_duration_s: 0.5

  # Motion limits and localization resets.
  max_speed_m_s: 2
  max_acceleration_m_s2: 3
  max_tracking_error_m: 0.5
  world_limit_m: 30
  reset_jump_m: 0.5
  reset_yaw_rad: 0.7853981634

  # Deployment authorization.
  flight_enabled: true
  failsafe_validated: true
  sensors_validated: true

hardware:
  # Update after camera calibration.
  calibration:
    image_size: [1280, 720]
    K:
      - [697.4651534182339, 0, 620.5961334574399]
      - [0, 697.2569487112386, 387.86385915688874]
      - [0, 0, 1]
    D: [-0.0035654592874208844, 0.00789647714740566, 0.0007123365403213933, -0.000556373229472051, -0.015200276049590199]
    distortion_model: "plumb_bob"

# Update after sensor calibration. Translations: m; T_target_from_source.
