# Runtime timing and Robot request limits.
runtime:
  # Wait after every motion action before reading the resulting pose (seconds).
  action_sleep_s: 0.2
  # Minimum Robot-side completion timeout for each I7 motion. Longer movements
  # may receive a larger distance-based timeout (seconds).
  motion_timeout_s: 15.0
  # --http-timeout-s can override this for one run without changing the YAML.
  http_request_timeout_s: 180.0

# Multi-waypoint mission in a fixed frame whose origin is the first takeoff
# hover pose. XYZ uses centimetres; positive yaw is clockwise in degrees.
mission:
  frame: takeoff_world
  position_unit: cm
  yaw_unit: deg

  # continue: return to the current waypoint and visit the next waypoint.
  # return_home: return home after the first waypoint task failure.
  on_task_failure: continue

  # Replace these example waypoints with site-specific collision-free points.
  # z_cm=0 keeps the takeoff hover altitude. After frame conversion, every
  # target must remain at or above the planner's 50cm world-height limit.
  waypoints:
    - name: waypoint_1
      x_cm: 100.0
      y_cm: -150.0
      z_cm: 0.0
      yaw_deg: -90.0
      # true: only verify transit/arrival, then continue to the next waypoint.
      # false: run SEARCH/TRACK/SCAN after arrival.
      only_arrive: false

    - name: waypoint_2
      x_cm: 650.0
      y_cm: -150.0
      z_cm: 0.0
      yaw_deg: -90.0
      only_arrive: false


# Motion limits and pixel-error conversion used while tracking the target.
motion:
  # Resolution at which the pixel-error gains below were calibrated. At
  # startup, v20 scales the horizontal gain by reference_width/actual_width
  # and the vertical gain by reference_height/actual_height.
  reference_width_px: 640
  reference_height_px: 360

  # Forward/backward action.
  max_fb_step_cm: 50.0
  # Visual approach deadband; Server pose tolerance filters final XYZ jointly.
  fb_stop_step_cm: 5.0 # 5.0
  backward_ratio: 0.5

  # Vertical action.
  max_z_step_cm: 30.0 # 30.0
  z_cm_per_pixel: 0.16

  # Yaw action.
  max_rotate_deg: 30.0 # 45.0
  rotate_deg_per_pixel: 0.1
  # Small forward component used by non-SEARCH pure-yaw actions so I7 routes
  # the command through the XYZ/EGO path.
  pure_rotate_forward_cm: 1.0

# Flight safety thresholds.
safety:
  # Absolute world-height floor used when planning Agent targets.
  safe_z_cm: 20.0
  depth_safe_distance_cm: 120.0
  # Forward-path depth uses this percentile inside an ROI that covers at
  # least these fractions of the image width and height.
  depth_path_percentile: 1.0
  depth_path_min_roi_width_ratio: 0.5
  depth_path_min_roi_height_ratio: 0.5

# Search pattern at each waypoint.
search:
  rotation_step_deg: 30.0 # 30
  height_offset_cm: 50.0
  # Forward distance sent together with every SEARCH rotation. Values <= 0,
  # such as 0 or -1, disable forward motion.
  forward_cm: 16.0
  # Keep only Z aligned to the first view of each 360-degree SEARCH turn.
  # X/Y are allowed to change with forward motion.
  align_z_to_first_view: true
  # SAM3 search intentionally requests low-threshold debug results, then keeps
  # only the strongest configured number of candidates per view.
  sam3_top_k: 3
  sam3_debug_confidence_threshold: 0.0

# Generic candidate filtering after detector thresholding and NMS.
detection:
  max_candidates_per_frame: 5

# Rank robust best views after de-duplicating prompt aliases and rejecting
# detections that are too close to an image edge.
select:
  # Whether to reject detections that are too close to an image edge.
  use_edge_margin_filter: false
  # true: before AREA ranking, discard candidates whose confidence is below
  # the active detector's configured confidence threshold.
  filter_by_detector_confidence: true
  # true: after the AREA stage, rank by area * confidence. false: rank only
  # by confidence as before.
  use_area_confidence_product: true
  # Whether target distance from the image center participates in view
  # selection. false keeps the AREA/CONFIDENCE result without CENTER ranking.
  use_center_metric: false
  dedup_iou_threshold: 0.80
  min_edge_margin_ratio: 0.08
  area_top_k: 10
  confidence_top_k: 5
  max_view_attempts: 3

# Target approach and convergence settings.
track:
  # true: skip iterative TRACK, fly forward once from the aligned best view,
  # then use the reached pose as the SCAN center. false: keep the TRACK flow.
  skip: false
  skip_forward_cm: 20.0
  target_stop_ratio: 0.40
  yaw_only_threshold_deg: 10.0
  max_exec_iters: 200

# Circular multi-view scan settings.
scan:
  # false: 12 points; true: only 12, 3, 6, and 9 o'clock.
  simplified: true
  num_points: 12
  radius_cm: 20.0 # 30.0
  yaw_unit_deg: 4.0

# Detector parameters intended for experiment-time tuning.
# Every listed value is required; implementation paths and device settings
# are kept inside the detector adapters.
detectors:
  yolo:
    input_size: 640
    score_threshold: 0.1
    nms_iou_threshold: 0.70
    fp16: true

  grounding_dino:
    box_threshold: 0.35
    text_threshold: 0.25

  sam3:
    confidence_threshold: 0.50

# Tracker-specific parameters intended for experiment-time tuning.
trackers:
  sam2: {}
